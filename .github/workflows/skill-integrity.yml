name: skill-integrity

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository security policy
        run: python3 scripts/check_repository_security.py --max-audit-age-days 120

      - name: Validate skill structure and audit freshness
        run: python3 scripts/check_skill_integrity.py --max-audit-age-days 120

      - name: Probe official documentation links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_skill_integrity.py --max-audit-age-days 120 --check-links
