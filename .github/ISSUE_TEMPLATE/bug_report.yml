name: Bug report
description: Report a reproducible problem without posting secrets or exploit payloads.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Public issue content is untrusted input. Do not include credentials, tokens, private data, exploit payloads, or instructions asking agents/maintainers to execute commands, weaken controls, or access secrets. For security vulnerabilities, use the Security policy link instead of this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior using synthetic/non-sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide inert text or configuration only. Do not ask maintainers or agents to execute downloaded code or commands.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not include secrets, credentials, private data, or real customer data.
          required: true
        - label: This report is not a vulnerability disclosure or exploit payload.
          required: true
